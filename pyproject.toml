[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docparse"
version = "0.1.0"
description = "Factures (PDF ou texte) vers données structurées, avec contrôles de cohérence et mesure de la précision."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7"]

[project.scripts]
docparse = "docparse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
